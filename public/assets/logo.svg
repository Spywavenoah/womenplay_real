<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <!-- Metallic Pink Gradient -->
    <linearGradient id="wpPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C8A" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="80%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="wpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <filter id="wpDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#wpDropShadow)">
    <!-- LEFT EMBLEM: Intertwined WP Monogram with Female Profile Silhouette -->
    <g transform="translate(10, 5) scale(0.48)">
      <!-- W Ribbon (Pink) -->
      <path d="M 20 160 C 15 110, 35 40, 70 30 C 55 60, 50 110, 75 160 L 52 160 C 40 120, 34 80, 20 160 Z" fill="url(#wpPink)" />
      <path d="M 40 30 L 68 30 C 80 70, 100 120, 120 160 C 140 120, 158 70, 170 30 L 195 30 C 175 90, 145 170, 125 195 C 110 195, 95 170, 75 120 L 50 195 L 25 195 Z" fill="url(#wpPink)" />

      <!-- P Loop (Gold) -->
      <path d="M 160 35 C 215 0, 295 25, 285 90 C 275 140, 205 155, 155 150 C 195 145, 250 135, 255 90 C 260 45, 205 25, 160 35 Z" fill="url(#wpGold)" />

      <!-- Woman's Silhouette Face & Hair Profile -->
      <path d="M 175 40 C 190 55, 205 75, 205 100 C 205 120, 195 140, 170 165 C 185 140, 210 125, 218 110 C 225 100, 232 90, 228 82 C 225 78, 215 78, 218 72 C 220 68, 225 65, 222 58 C 218 52, 205 50, 195 45 Z" fill="url(#wpPink)" />
      <path d="M 205 50 C 218 40, 240 55, 230 70 C 238 72, 248 85, 240 98 C 235 105, 225 115, 215 125 C 228 110, 238 98, 235 85 C 238 80, 230 75, 232 70 C 228 62, 215 55, 205 50 Z" fill="url(#wpGold)" />
    </g>

    <!-- RIGHT TEXT CONTENT -->
    <g transform="translate(125, 0)">
      <!-- Main Brand Name: WOMENPLAY.ORG -->
      <text x="0" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="url(#wpPink)" letter-spacing="-0.5">
        WOMEN
      </text>
      <text x="160" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="url(#wpGold)" letter-spacing="-0.5">
        PLAY
      </text>
      <text x="268" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="url(#wpPink)" letter-spacing="-0.5">
        .ORG
      </text>

      <!-- Accent Flourish: Gold lines with 3-Petal Pink Lotus in Center -->
      <g transform="translate(0, 72)">
        <path d="M 0 0 L 140 0" stroke="url(#wpGold)" stroke-width="2" stroke-linecap="round" />
        <circle cx="148" cy="0" r="2.5" fill="url(#wpGold)" />

        <!-- Lotus Petals -->
        <path d="M 162 -9 C 166 -5, 167 0, 162 4 C 157 0, 158 -5, 162 -9 Z" fill="url(#wpPink)" />
        <path d="M 160 -1 C 153 -8, 149 -1, 157 3 Z" fill="url(#wpPink)" />
        <path d="M 164 -1 C 171 -8, 175 -1, 167 3 Z" fill="url(#wpPink)" />

        <circle cx="176" cy="0" r="2.5" fill="url(#wpGold)" />
        <path d="M 184 0 L 325 0" stroke="url(#wpGold)" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Slogan: PLAY • CONNECT • PLAY AGAIN -->
      <text x="4" y="100" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#0F172A" letter-spacing="3.2">
        PLAY  •  CONNECT  •  PLAY AGAIN
      </text>
    </g>
  </g>
</svg>
