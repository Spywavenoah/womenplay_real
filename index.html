<!doctype html>

    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" errors by ensuring window.fetch and globalThis.fetch are writable
      (function() {
        try {
          let currentFetch = window.fetch || (typeof globalThis !== 'undefined' ? globalThis.fetch : null);
          if (currentFetch) {
            const desc = {
              get() {
                return currentFetch;
              },
              set(v) {
                currentFetch = v;
              },
              configurable: true,
              enumerable: true
            };
            Object.defineProperty(window, 'fetch', desc);
            if (typeof globalThis !== 'undefined') {
              Object.defineProperty(globalThis, 'fetch', desc);
            }
          }
        } catch (e) {
          console.warn("Failed to patch window.fetch:", e);
        }
      })();
    </script>
